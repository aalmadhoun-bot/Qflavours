<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المستخدمون — فليفرز</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<nav id="nav" class="topnav"></nav>
<main>

<section class="card hidden" id="denied">
  <h2>⛔ هذه الصفحة للمديرين فقط</h2>
  <p class="hint">اطلب من المدير إضافتك كمدير إذا كنت تحتاج إدارة المستخدمين.</p>
</section>

<section class="card hidden" id="formCard">
  <h2 id="formTitle">➕ إضافة مستخدم</h2>
  <form id="form">
    <div class="grid">
      <div><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="off" required></div>
      <div><label for="name">الاسم</label><input id="name" type="text" required></div>
      <div><label for="role">الصلاحية</label>
        <select id="role">
          <option value="user">مستخدم — يستخدم الأداة فقط</option>
          <option value="admin">مدير — يستخدم الأداة ويدير المستخدمين</option>
        </select>
      </div>
      <div><label for="password" id="pwLabel">كلمة المرور (8 أحرف على الأقل)</label>
        <div style="display:flex;gap:6px">
          <input id="password" type="text" class="ltr" autocomplete="new-password" minlength="8">
          <button type="button" id="gen" class="sec sm" title="توليد كلمة مرور">🎲</button>
        </div>
      </div>
    </div>
    <div class="row">
      <button type="submit" id="save">إضافة</button>
      <button type="button" id="cancel" class="sec hidden">إلغاء التعديل</button>
    </div>
  </form>
  <div id="msg" class="status hidden"></div>
  <p class="hint">أرسل البريد وكلمة المرور للمستخدم بطريقة آمنة، ويمكنه تغيير كلمة المرور بعد الدخول من زر 🔑 في الشريط العلوي.</p>
</section>

<section class="card hidden" id="listCard">
  <h2>👥 المستخدمون <span class="pill" id="count">0</span></h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>الاسم</th><th>البريد</th><th>الصلاحية</th><th>أُضيف في</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>

</main>
<script type="module" src="js/users.js"></script>
</body>
</html>
