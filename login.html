<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول — فليفرز</title>
<link rel="icon" type="image/png" href="/img/flavours-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="login">
  <section class="card">
    <img class="login-logo" src="/img/flavours-logo.png" alt="فليفرز">
    <h1>أداة رفع البيانات</h1>
    <p class="hint" style="text-align:center;margin:0">ادخل بالبريد الذي أضافه لك المدير</p>
    <form id="form">
      <div><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required autofocus></div>
      <button type="submit" id="btn">دخول</button>
    </form>
    <div id="msg" class="status bad hidden"></div>
  </section>
</div>
<script type="module" src="js/login.js"></script>
</body>
</html>
