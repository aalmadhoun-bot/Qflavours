<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { if (localStorage.getItem("qf_lang") === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; } } catch (e) {}</script>
<title data-en="Sign in — Flavours">تسجيل الدخول — فليفرز</title>
<link rel="icon" type="image/png" href="/img/flavours-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="login">
  <button type="button" class="lang-btn sm login-lang" data-lang-toggle>English</button>
  <section class="card">
    <img class="login-logo" src="/img/flavours-logo.png" alt="Flavours — فليفرز">
    <h1 data-en="Data Upload Tool">أداة رفع البيانات</h1>
    <p class="sub" data-en="Sign in with the email your admin added for you">ادخل بالبريد الذي أضافه لك المدير</p>
    <form id="form">
      <div><label for="email" data-en="Email address">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required autofocus data-en-ph="name@company.com" placeholder="name@company.com"></div>
      <button type="submit" id="btn" data-en="Sign in">دخول</button>
    </form>
    <div id="msg" class="status bad hidden"></div>
  </section>
</div>
<script type="module" src="js/login.js"></script>
</body>
</html>
