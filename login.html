<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول — فليفرز</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="login">
  <section class="card">
    <h1>🍔 أداة رفع بيانات فليفرز</h1>
    <p class="hint" style="text-align:center;margin:0">سجّل الدخول بالحساب الذي أضافه لك المدير</p>
    <form id="form">
      <div><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required autofocus></div>
      <div><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button type="submit" id="btn">دخول</button>
    </form>
    <div id="msg" class="status bad hidden"></div>
  </section>
</div>
<script type="module" src="js/login.js"></script>
</body>
</html>
